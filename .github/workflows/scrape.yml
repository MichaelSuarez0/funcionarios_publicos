name: Scrape directorio

on:
  schedule:
    - cron: "0 6 * * 0"   # domingo 06:00 UTC (01:00 hora Perú)
  workflow_dispatch:

permissions:
  contents: write          # necesario para hacer push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: mkdir -p data

      - run: uv run main.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: actualizar funcionarios $(date -u +%F)"
          git push